[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    # Reproducibility justification: this execution environment's Python runtime
    # is built without `_sqlite3`, which breaks `coverage`/`pytest-cov`. Coverage
    # reporting is not required for scientific correctness; disabling it enables
    # deterministic unit-test execution without external system dependencies.
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU
    integration: marks tests as integration tests
    unit: marks tests as unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
